 app.innerHTML=`<div class=nav style="color:#ff375f"><span></span><span></span><span>⋯</span></div><div class=title style="margin:0 18px 8px">음악</div><div class=body style="padding-bottom:96px">${SONGS.map((x,i)=>`<div class=ms onclick="pl(${i})"><img src="${ART[i]}"><div class=mt><div><b id=sb${i}>${esc(x[0])}</b><span>${esc(x[1])}</span></div><i>•••</i></div></div>`).join("")}<div class=ms><div class=add>＋</div><div class=mt><div style="font-size:17px">음악 추가</div></div></div></div><div class=mpl><div class=mpr><i id=mpf></i></div><img id=mpa><div class=mpt><b id=mpn></b><span id=mpar></span></div><span id=mpp onclick="tg()">⏸</span><span onclick="pl(on+1)">⏭</span></div>`;
 const ui=()=>{$("#mpa").src=ART[on];$("#mpn").textContent=SONGS[on][0];$("#mpar").textContent=SONGS[on][1];$("#mpp").textContent=play?"⏸":"▶️";SONGS.forEach((_,i)=>{$("#sb"+i).style.color=i==on?"#ff375f":""});$("#mpf").style.width=p+"%"};
 const run=()=>{clearInterval(iv);if(play)iv=setInterval(()=>{p+=.5;if(p>=100){p=0;on=(on+1)%N;ui()}$("#mpf").style.width=p+"%"},300)};
 window.pl=i=>{on=(i+N)%N;p=0;play=true;ui();run()};window.tg=()=>{play=!play;ui();run()};
 p=22;ui();run()}

 const G=(z)=>`<div class=gl style="font-size:${z}px;margin:0">${[["G","#4285f4"],["o","#ea4335"],["o","#fbbc05"],["g","#4285f4"],["l","#34a853"],["e","#ea4335"]].map(x=>`<b style="color:${x[1]}">${x[0]}</b>`).join("")}</div>`;
 const home=()=>{const K=(d,c)=>`<svg width=26 height=26 viewBox="0 0 24 24" fill=none stroke=${c||"#4a4d55"} stroke-width=2.3 stroke-linecap=round>${d}</svg>`;

  const q=$("#gq"),hl=$("#hl");let L=[];
  const draw=()=>{const v=q.value.trim();L=HISTORY.filter(x=>!v||x.includes(v));hl.innerHTML=L.map((x,i)=>{const t=v&&x.startsWith(v)?esc(v)+"<b>"+esc(x.slice(v.length))+"</b>":esc(x);return `<div class=hr data-i=${i}><svg width=22 height=22 viewBox="0 0 24 24" fill=none stroke=#9a9aa0 stroke-width=2.6 stroke-linecap=round><circle cx=10 cy=10 r=6.5 /><path d="M15 15l6 6"/></svg><span class=t>${t}</span><svg class=ha width=26 height=26 viewBox="0 0 24 24" fill=none stroke=#9a9aa0 stroke-width=2.2 stroke-linecap=round stroke-linejoin=round><path d="M17 17L7 7M7 15V7h8"/></svg></div>`}).join("")};
  hl.onclick=e=>{const r=e.target.closest(".hr");if(!r)return;const t=L[r.dataset.i];if(e.target.closest(".ha")){q.value=t;q.focus();draw()}else res(t)};
  q.oninput=draw;q.onkeydown=e=>{if(e.key=="Enter"&&q.value.trim())res(q.value.trim())};draw()};
 const res=q=>{const e=q.replace(/</g,"&lt;");app.innerHTML=`<div style="display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid #eee"><span onclick="safari()" style="cursor:pointer">${G(26)}</span><div class=gs style="width:auto;flex:1;height:38px;box-shadow:none;padding:0 12px"><span style="flex:1;font-size:15px">${e}</span></div></div><div class=body style="padding:0">${[["나무위키",e+" - 나무위키","namu.wiki"],["위키백과",e+" - 위키백과","ko.wikipedia.org"],["네이버",e+" : 네이버 검색","search.naver.com"],["YouTube",e+" - YouTube","youtube.com"]].map(x=>`<div class=gr><u>${x[2]}</u><b>${x[1]}</b><p>${e}에 대한 검색 결과입니다. 관련 정보와 최신 소식을 확인해 보세요.</p></div>`).join("")}</div><div class=sfbar><div>🔒 google.com/search</div></div>`};
 home()}
